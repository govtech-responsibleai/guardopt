<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="guardopt: three faders in a shield — accuracy at maximum, cost and latency at minimum">
  <!-- The brand in one drawing: the guard shield holding a fader board.
       Teal (accuracy) is pushed to the top; amber (cost) and ember (latency)
       are pinned to the floor. Maximise accuracy. Minimise cost and latency. -->
  <path d="M32 2 L62 12.5 V31 C62 47 51.5 57.5 32 62 C12.5 57.5 2 47 2 31 V12.5 Z"
        fill="#10201B" stroke="#2C3B34" stroke-width="2.5"/>
  <g stroke-linecap="round">
    <line x1="17" y1="12" x2="17" y2="48" stroke="#2C3B34" stroke-width="4"/>
    <line x1="32" y1="12" x2="32" y2="48" stroke="#2C3B34" stroke-width="4"/>
    <line x1="47" y1="12" x2="47" y2="48" stroke="#2C3B34" stroke-width="4"/>
    <line x1="17" y1="17" x2="17" y2="48" stroke="#5BC4AD" stroke-width="4" opacity="0.4"/>
    <line x1="32" y1="43" x2="32" y2="48" stroke="#DCAF5A" stroke-width="4" opacity="0.4"/>
    <line x1="47" y1="43" x2="47" y2="48" stroke="#E2734F" stroke-width="4" opacity="0.4"/>
  </g>
  <circle cx="17" cy="17" r="5.5" fill="#5BC4AD" stroke="#10201B" stroke-width="2"/>
  <circle cx="32" cy="43" r="5.5" fill="#DCAF5A" stroke="#10201B" stroke-width="2"/>
  <circle cx="47" cy="43" r="5.5" fill="#E2734F" stroke="#10201B" stroke-width="2"/>
</svg>
